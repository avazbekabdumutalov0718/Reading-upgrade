let currentUnit = null;
let currentIndex = 0;

function renderUnitGrid() {
  const totalWords = UNITS.reduce((sum, u) => sum + u.words.length, 0);
  document.getElementById('unitGridView').innerHTML = `
    <div class="dash-greeting">
      <div>
        <h1>Task 2 Essay Vocabulary</h1>
        <p>Topic-specific vocabulary drawn from ${UNITS.length} real IELTS Writing Task 2 model essays &mdash; flip through each word's meaning, Uzbek translation, and two example sentences.</p>
      </div>
      <div class="band-pill">${totalWords} words &middot; ${UNITS.length} units</div>
    </div>
    <div class="unit-grid" id="unitGrid">
      ${UNITS.map((u, i) => `
        <button class="unit-card" type="button" data-i="${i}">
          <span class="unit-card-num">Essay ${u.id}</span>
          <span class="unit-card-title">${u.title}</span>
          <span class="unit-card-count">${u.words.length} words</span>
        </button>
      `).join('')}
    </div>
  `;
  document.querySelectorAll('#unitGrid [data-i]').forEach(btn => {
    btn.addEventListener('click', () => openUnit(+btn.dataset.i));
  });
}

function openUnit(i) {
  currentUnit = UNITS[i];
  currentIndex = 0;
  document.getElementById('unitGridView').hidden = true;
  document.getElementById('flashcardView').hidden = false;
  showCard();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showCard() {
  const w = currentUnit.words[currentIndex];
  const inner = document.getElementById('flashcardInner');
  inner.classList.remove('flipped');
  document.getElementById('flashWord').textContent = w.word;
  document.getElementById('flashBackWord').textContent = w.word;
  document.getElementById('flashDef').textContent = w.meaning;
  document.getElementById('flashTranslation').textContent = w.uz;
  document.getElementById('flashExample1').textContent = w.ex1;
  document.getElementById('flashExample2').textContent = w.ex2 || '';
  document.getElementById('flashExample2').style.display = w.ex2 ? 'block' : 'none';
  document.getElementById('flashProgress').textContent = `${currentIndex + 1} / ${currentUnit.words.length}`;
}

document.getElementById('flashcard').addEventListener('click', () => {
  document.getElementById('flashcardInner').classList.toggle('flipped');
});

document.getElementById('flashPrev').addEventListener('click', (e) => {
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + currentUnit.words.length) % currentUnit.words.length;
  showCard();
});
document.getElementById('flashNext').addEventListener('click', (e) => {
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % currentUnit.words.length;
  showCard();
});
document.getElementById('backFromFlashcards').addEventListener('click', () => {
  document.getElementById('flashcardView').hidden = true;
  document.getElementById('unitGridView').hidden = false;
});

renderUnitGrid();
</script>

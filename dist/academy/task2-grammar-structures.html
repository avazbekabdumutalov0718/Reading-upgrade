<script>
const STRUCTURES = [
  {
    "category": "Concession & Contrast",
    "title": "Although / Even though / While",
    "uz_title": "Garchi / Hatto agar / Holbuki",
    "structure": "Although + [clause], + [main clause]",
    "explanation": "Used to show a contrast or surprising relationship between two ideas. Signals academic maturity — shows you can acknowledge opposing views.",
    "uz_explanation": "Ikki fikr o'rtasidagi ziddiyat yoki kutilmagan munosabatni ko'rsatish uchun ishlatiladi. Qarama-qarshi fikrlarni tan olish qobiliyatini namoyon etadi.",
    "example_en": "Although governments have invested heavily in renewable energy, carbon emissions continue to rise at an alarming rate.",
    "example_uz": "Garchi hukumatlar qayta tiklanadigan energiyaga ko'p investitsiya kiritgan bo'lsa-da, uglerod chiqindilari tashviqlanarli tarzda o'sishda davom etmoqda."
  },
  {
    "category": "Concession & Contrast",
    "title": "Despite / In spite of",
    "uz_title": "Qaramasdan / Shunga qaramay",
    "structure": "Despite + [noun / -ing], + [main clause]",
    "explanation": "Shows contrast between a factor and an unexpected outcome. Followed by a noun or gerund (NOT a full clause). Highly valued in Band 7+ essays.",
    "uz_explanation": "Bir omil va kutilmagan natija o'rtasidagi ziddiyatni ko'rsatadi. Ot yoki gerund bilan ishlatiladi (to'liq gap emas). Band 7+ insholarda keng qo'llaniladi.",
    "example_en": "Despite the significant economic benefits of tourism, many local communities suffer from overcrowding and cultural erosion.",
    "example_uz": "Turizmning sezilarli iqtisodiy foydalariga qaramasdan, ko'plab mahalliy jamoalar gavjumlik va madaniy eroziyadan aziyat chekadi."
  },
  {
    "category": "Concession & Contrast",
    "title": "However / Nevertheless / Nonetheless",
    "uz_title": "Biroq / Shunga qaramasdan / Baribir ham",
    "structure": "[Sentence 1]. However, + [Sentence 2]",
    "explanation": "Discourse markers used to introduce a contrasting or limiting idea. 'However' is the most common; 'nevertheless' adds more formal weight.",
    "uz_explanation": "Zid yoki cheklovchi fikrni kiritish uchun ishlatiladi. 'However' eng keng tarqalgani; 'nevertheless' rasmiyroq uslub beradi.",
    "example_en": "Urbanisation offers numerous economic advantages. However, the rapid growth of cities places enormous pressure on infrastructure and public services.",
    "example_uz": "Urbanizatsiya ko'plab iqtisodiy ustunliklarni taklif etadi. Biroq, shaharlarning tez o'sishi infratuzilma va jamoat xizmatlariga ulkan bosim o'tkazadi."
  },
  {
    "category": "Cause & Effect",
    "title": "As a result / Consequently / Therefore",
    "uz_title": "Natijada / Shu sababli / Demak",
    "structure": "[Cause sentence]. As a result, + [effect sentence]",
    "explanation": "Connectives that link a cause to its result. Essential for Task 2 problem/solution and cause/effect essays. 'Therefore' is more logical; 'consequently' more formal.",
    "uz_explanation": "Sabab va natijani bog'laydigan bog'lovchilar. Task 2 muammo/yechim va sabab/oqibat insholarida zaruriy. 'Therefore' mantiqiyroq; 'consequently' rasmiyroq.",
    "example_en": "The widespread use of social media has dramatically reduced face-to-face communication. As a result, many young people struggle with basic social skills.",
    "example_uz": "Ijtimoiy tarmoqlardan keng foydalanish yuzma-yuz muloqotni keskin kamaytirdi. Natijada, ko'plab yoshlar asosiy ijtimoiy ko'nikmalar bilan qiynalyapti."
  },
  {
    "category": "Cause & Effect",
    "title": "Due to / Owing to / Because of",
    "uz_title": "Tufayli / Sababli / Natijasida",
    "structure": "Due to + [noun phrase], + [main clause]",
    "explanation": "Prepositions introducing a cause. Must be followed by a noun or noun phrase — not a full clause. Often confused with 'because', which introduces a clause.",
    "uz_explanation": "Sabab kirituvchi predloglar. Ot yoki ot iborasidan keyin keladi — to'liq gap emas. Ko'pincha 'because' bilan aralashtiriladi, u esa gap bilan keladi.",
    "example_en": "Due to rapid advances in technology, traditional manufacturing jobs are becoming increasingly scarce in developed economies.",
    "example_uz": "Texnologiyaning tez rivojlanishi tufayli an'anaviy ishlab chiqarish ishlari rivojlangan iqtisodiyotlarda tobora kamayib bormoqda."
  },
  {
    "category": "Cause & Effect",
    "title": "This leads to / results in / gives rise to",
    "uz_title": "Bu ... ga olib keladi / natija beradi / sabab bo'ladi",
    "structure": "[Subject] + leads to / results in / gives rise to + [noun / -ing]",
    "explanation": "Sophisticated verb phrases showing cause-and-effect within a sentence. 'Gives rise to' is particularly impressive in formal academic writing.",
    "uz_explanation": "Bir jumlada sabab-oqibatni ko'rsatuvchi murakkab fe'l iboralari. 'Gives rise to' rasmiy akademik yozuvda ayniqsa ta'sirchan.",
    "example_en": "Excessive screen time among children gives rise to a range of developmental and psychological concerns that parents must address.",
    "example_uz": "Bolalarda ekran oldida ortiqcha vaqt o'tkazish ota-onalar hal qilishi kerak bo'lgan bir qator rivojlanish va psixologik muammolarga sabab bo'ladi."
  },
  {
    "category": "Conditional",
    "title": "First Conditional (Real / Likely)",
    "uz_title": "Birinchi shart (Haqiqiy / Ehtimoliy)",
    "structure": "If + [present simple], + [will / can / may + verb]",
    "explanation": "Used for real or likely future situations. Essential for discussing policies, solutions, and predictions in Task 2 essays.",
    "uz_explanation": "Haqiqiy yoki ehtimoliy kelajak holatlarni ifodalash uchun ishlatiladi. Task 2 insholarda siyosat, yechimlar va bashoratlarni muhokama qilishda muhim.",
    "example_en": "If governments invest more in early childhood education, the long-term social and economic benefits will far outweigh the initial costs.",
    "example_uz": "Agar hukumatlar erta bolalik ta'limiga ko'proq sarmoya kiritsa, uzoq muddatli ijtimoiy va iqtisodiy foydalar boshlang'ich xarajatlardan ancha oshadi."
  },
  {
    "category": "Conditional",
    "title": "Second Conditional (Hypothetical)",
    "uz_title": "Ikkinchi shart (Faraziy)",
    "structure": "If + [past simple], + [would / could / might + verb]",
    "explanation": "Describes hypothetical or unlikely present/future situations. Excellent for discussing ideal scenarios or policy recommendations.",
    "uz_explanation": "Faraziy yoki ehtimoli kam hozirgi/kelajak holatlarni tavsiflaydi. Ideal stsenariylar yoki siyosat tavsiyalarini muhokama qilishda ajoyib.",
    "example_en": "If every individual reduced their carbon footprint by just 20%, the cumulative impact on global warming would be substantial.",
    "example_uz": "Agar har bir shaxs o'zining uglerod izini atigi 20% ga kamaytirsa, global isishga yig'ma ta'sir sezilarli bo'lar edi."
  },
  {
    "category": "Passive Voice",
    "title": "Present / Past Passive",
    "uz_title": "Hozirgi / O'tgan zamon passiv",
    "structure": "[Subject] + is/are/was/were + [past participle] + (by + agent)",
    "explanation": "The passive voice is preferred in academic writing when the action or result is more important than who performed it. Adds objectivity and formality.",
    "uz_explanation": "Passiv nido akademik yozuvda harakat yoki natija kimdan muhimroq bo'lganda afzal ko'riladi. Ob'ektivlik va rasmiylik qo'shadi.",
    "example_en": "Millions of tonnes of plastic waste are generated annually, and a significant proportion is dumped into the world's oceans.",
    "example_uz": "Har yili millionlab tonna plastik chiqindi ishlab chiqariladi va uning katta qismi dunyo okeanlariga tashlanaveradi."
  },
  {
    "category": "Passive Voice",
    "title": "It is argued / believed / suggested",
    "uz_title": "Bahslashiladi / Ishoniladi / Tavsiya etiladi",
    "structure": "It is + [argued / believed / claimed / suggested] + that + [clause]",
    "explanation": "Impersonal passive constructions used to report views without stating who holds them. Creates academic distance and objectivity — crucial for Task 2.",
    "uz_explanation": "Kim ushlaganini ko'rsatmasdan fikrlarni bildirish uchun ishlatiladigan shaxssiz passiv konstruksiyalar. Akademik masofa va ob'ektivlik yaratadi.",
    "example_en": "It is widely argued that the education system should place greater emphasis on critical thinking rather than rote memorisation.",
    "example_uz": "Ta'lim tizimi yodlashdan ko'ra tanqidiy fikrlashga ko'proq e'tibor qaratishi kerak, deb keng bahslashiladi."
  },
  {
    "category": "Relative Clauses",
    "title": "Defining Relative Clause",
    "uz_title": "Aniqlovchi munosabat gapi",
    "structure": "[Noun] + who / which / that + [verb phrase]",
    "explanation": "Adds essential information that identifies the noun. Without this clause, the sentence loses its meaning. Used extensively in academic writing to be precise.",
    "uz_explanation": "Otni aniqlaydigan muhim ma'lumot qo'shadi. Bu gap bo'lmasdan, jumla ma'nosini yo'qotadi. Aniqlikni ta'minlash uchun akademik yozuvda keng qo'llaniladi.",
    "example_en": "Students who develop strong analytical skills tend to perform significantly better in all academic disciplines throughout their university careers.",
    "example_uz": "Kuchli tahliliy ko'nikmalarni rivojlantirgan talabalar universitet karrieralari davomida barcha akademik intizomlar bo'yicha sezilarli darajada yaxshiroq o'zlarini ko'rsatadilar."
  },
  {
    "category": "Relative Clauses",
    "title": "Non-defining Relative Clause",
    "uz_title": "Aniqlamaydigan munosabat gapi",
    "structure": "[Noun], + which / who / whom, + [extra information]",
    "explanation": "Adds non-essential extra information, separated by commas. The main clause still makes complete sense without it. Shows sophisticated sentence construction.",
    "uz_explanation": "Vergullar bilan ajratilgan muhim bo'lmagan qo'shimcha ma'lumot qo'shadi. Asosiy gap usiz ham to'liq ma'noga ega. Murakkab jumla qurilishini ko'rsatadi.",
    "example_en": "Climate change, which scientists have identified as the defining challenge of our era, demands immediate and coordinated global action.",
    "example_uz": "Iqlim o'zgarishi, olimlar uni zamonamizning asosiy muammosi sifatida aniqlagan, darhol va muvofiq global harakatni talab etadi."
  },
  {
    "category": "Comparison",
    "title": "Comparative Structures",
    "uz_title": "Qiyosiy konstruksiyalar",
    "structure": "[A] is considerably / far / significantly + [comparative adj] + than [B]",
    "explanation": "Use adverbs like 'considerably', 'significantly', 'far' before comparatives to sound more academic and precise. Avoid 'more better' or 'much more bigger'.",
    "uz_explanation": "Akademik va aniq ko'rinish uchun qiyosiy sifatlar oldidan 'considerably', 'significantly', 'far' kabi ravishlardan foydalaning.",
    "example_en": "Public transport is considerably more efficient and environmentally sustainable than private car ownership in densely populated urban areas.",
    "example_uz": "Jamoat transporti zich aholili shaharlarda shaxsiy avtomobil egaligidan ancha samarali va atrof-muhit uchun barqarorroq."
  },
  {
    "category": "Comparison",
    "title": "The more ... the more / The + comparative",
    "uz_title": "Qancha ... shuncha / Qiyosiy + qiyosiy",
    "structure": "The + [comparative], + the + [comparative]",
    "explanation": "A powerful parallel structure showing proportional relationships. Demonstrates grammatical range and sophistication — a clear Band 7+ signal.",
    "uz_explanation": "Proportsional munosabatlarni ko'rsatuvchi kuchli parallel konstruksiya. Grammatik doira va murakkablikni namoyon etadi — Band 7+ aniq belgisi.",
    "example_en": "The more access young people have to quality education, the better equipped they are to contribute meaningfully to society and the economy.",
    "example_uz": "Yoshlar sifatli ta'limga qancha ko'p imkoniyatga ega bo'lsa, ular jamiyat va iqtisodiyotga mazmunli hissa qo'shishga shuncha ko'proq tayyorlangan bo'ladilar."
  },
  {
    "category": "Emphasis",
    "title": "It is / was ... that (Cleft Sentence)",
    "uz_title": "Ajratma jumla (Cleft Sentence)",
    "structure": "It is/was + [emphasised element] + that/who + [rest of sentence]",
    "explanation": "A cleft sentence shifts emphasis onto a specific part of the information. Adds variety and signals grammatical sophistication to the examiner.",
    "uz_explanation": "Ajratma jumla ma'lumotning muayyan qismiga urg'u beradi. Xilma-xillik qo'shadi va imtihon oluvchiga grammatik murakkablikni bildiradi.",
    "example_en": "It is the lack of affordable housing, rather than unemployment, that drives the majority of urban poverty in modern cities.",
    "example_uz": "Zamonaviy shaharlardagi shahar qashshoqligining asosiy qismini ishsizlik emas, balki arzon uy-joyning etishmasligi keltirib chiqaradi."
  },
  {
    "category": "Emphasis",
    "title": "What ... is / are (Nominal Cleft)",
    "uz_title": "Nominal ajratma jumla",
    "structure": "What + [subject] + [verb] + is/are + [complement]",
    "explanation": "Another cleft structure using a nominal clause to foreground information. Sounds highly sophisticated and is rarely used by lower-band candidates.",
    "uz_explanation": "Ma'lumotni birinchi planga chiqarish uchun nominal gap ishlatadigan yana bir ajratma konstruksiya. Juda murakkab eshitiladi va past band nomzodlari tomonidan kamdan-kam ishlatiladi.",
    "example_en": "What the healthcare system urgently requires is not more funding alone, but a fundamental restructuring of how services are delivered at the local level.",
    "example_uz": "Sog'liqni saqlash tizimi shoshilinch ravishda talab qiladigan narsa faqat ko'proq moliyalashtirish emas, balki mahalliy darajada xizmatlar qanday ko'rsatilishining fundamental qayta tuzilishidir."
  },
  {
    "category": "Addition",
    "title": "Furthermore / Moreover / In addition",
    "uz_title": "Bundan tashqari / Bundan ham ko'proq / Qo'shimcha ravishda",
    "structure": "[Sentence]. Furthermore / Moreover, + [new supporting point]",
    "explanation": "Discourse markers that add supporting information or extend an argument. 'Moreover' carries more weight than 'furthermore'; both are stronger than 'also'.",
    "uz_explanation": "Qo'llab-quvvatlovchi ma'lumot qo'shadigan yoki argumentni kengaytiradigan diskurs belgilari. 'Moreover' 'furthermore'dan ko'ra kuchliroq; ikkalasi ham 'also'dan kuchliroq.",
    "example_en": "Exercise improves cardiovascular health significantly. Furthermore, regular physical activity has been shown to reduce symptoms of anxiety and depression.",
    "example_uz": "Jismoniy mashq yurak-qon tomir salomatligini sezilarli darajada yaxshilaydi. Bundan tashqari, muntazam jismoniy faoliyat bezovtalanish va depressiya alomatlarini kamaytirishi ko'rsatilgan."
  },
  {
    "category": "Addition",
    "title": "Not only ... but also",
    "uz_title": "Nafaqat ... balki ham",
    "structure": "Not only + [clause/verb phrase], + but [subject] also + [verb]",
    "explanation": "A correlative conjunction that emphasises two related points simultaneously. The first clause often requires subject-verb inversion for formal effect.",
    "uz_explanation": "Bir vaqtning o'zida ikkita tegishli nuqtani ta'kidlaydigan korrelyativ bog'lovchi. Rasmiy ta'sir uchun birinchi gapda ko'pincha ega-kesim inversiyasi talab etiladi.",
    "example_en": "Not only does deforestation destroy vital ecosystems, but it also accelerates climate change by eliminating forests that absorb carbon dioxide.",
    "example_uz": "O'rmonlarni yo'q qilish nafaqat hayotiy ekotizimlarga zarar yetkazadi, balki karbonat angidrid yutuvchi o'rmonlarni yo'q qilish orqali iqlim o'zgarishini ham tezlashtiradi."
  },
  {
    "category": "Hedging",
    "title": "Tend to / appear to / seem to",
    "uz_title": "Moyil bo'lmoq / ko'rinmoq / uyg'un kelmoq",
    "structure": "[Subject] + tend to / appear to / seem to + [base verb]",
    "explanation": "Hedging language makes claims more cautious and academically appropriate. Overconfident statements weaken essays — hedging shows intellectual awareness.",
    "uz_explanation": "Da'volarni ehtiyotliroq va akademik jihatdan tegishliroq qiladigan til. Haddan tashqari ishonchli gaplar insholarni zaiflashtiradi — hedging intellektual ongli ekanini ko'rsatadi.",
    "example_en": "Wealthier nations tend to generate significantly more waste per capita, yet they also appear to have greater capacity to manage it responsibly.",
    "example_uz": "Boyroq davlatlar jon boshiga sezilarli darajada ko'proq chiqindi ishlab chiqarishga moyil bo'ladi, lekin ular uni mas'uliyat bilan boshqarish uchun ko'proq imkoniyatga ega bo'lib ko'rinadi."
  },
  {
    "category": "Hedging",
    "title": "It could be argued / suggested",
    "uz_title": "Bahslashish / taklif qilish mumkin",
    "structure": "It could be argued / suggested / claimed that + [clause]",
    "explanation": "Used to introduce a viewpoint cautiously without fully committing to it. Ideal for presenting both sides of a debate in a balanced, academic way.",
    "uz_explanation": "Fikrni to'liq qo'llamay ehtiyotkorona kiritish uchun ishlatiladi. Munozaraning ikki tomonini ham muvozanatli, akademik tarzda taqdim etish uchun ideal.",
    "example_en": "It could be argued that the benefits of globalisation, while considerable, are distributed in a deeply unequal and often unjust manner.",
    "example_uz": "Globallashuvning foydalari, sezilarli bo'lsa-da, juda tengsiz va ko'pincha adolatsiz tarzda taqsimlanishi haqida bahslashish mumkin."
  },
  {
    "category": "Complex Sentences",
    "title": "Participle Clauses (-ing / -ed)",
    "uz_title": "Sifatdosh gaplari (-ing / -ed)",
    "structure": "[Participle phrase], + [main clause]  OR  [Main clause], + [participle phrase]",
    "explanation": "Participial phrases replace full subordinate clauses, making sentences more concise and varied. A hallmark of Band 8+ writing. Avoids repetitive subject mention.",
    "uz_explanation": "Sifatdosh iboralari to'liq bo'ysunuvchi gaplarni almashtiradi, jumlalarni qisqaroq va xilma-xilroq qiladi. Band 8+ yozuvning belgisi. Takroriy ega eslatishdan qochadi.",
    "example_en": "Facing increasing pressure from international organisations, many governments have begun introducing stricter environmental regulations.",
    "example_uz": "Xalqaro tashkilotlardan ortib borayotgan bosimga duch kelib, ko'plab hukumatlar qattiqroq atrof-muhit qoidalarini joriy qilishni boshladi."
  },
  {
    "category": "Complex Sentences",
    "title": "Inversion for Emphasis",
    "uz_title": "Urg'u uchun inversiya",
    "structure": "Never / Rarely / Only + [auxiliary verb] + [subject] + [main verb]",
    "explanation": "Inverted sentence structure after negative or restrictive adverbs creates a formal, emphatic tone. Exclusively found in Band 8–9 responses.",
    "uz_explanation": "Inkor yoki cheklovchi ravishlardan keyin inversiya rasmiy, ta'kidli ohang yaratadi. Faqat Band 8–9 javoblarda uchraydi.",
    "example_en": "Never before in human history have we faced an environmental crisis of such complexity, scale, and urgency as the one confronting us today.",
    "example_uz": "Insoniyat tarixida hech qachon biz bugun duch kelayotgan kabi murakkab, keng va shoshilinch atrof-muhit inqiroziga duch kelmagan."
  }
];

const gridView = document.getElementById('gsGridView');
const detailView = document.getElementById('gsDetailView');

function renderGrid() {
  gridView.innerHTML = `
    <div class="dash-greeting">
      <div>
        <h1>IELTS Writing Task 2 — Grammar Structures</h1>
        <p>22 essential Band 7&ndash;9 grammar structures, explained in English, translated in Uzbek, with real examples.</p>
      </div>
      <div class="band-pill">${STRUCTURES.length} structures</div>
    </div>
    <div class="unit-grid" id="gsCardGrid">
      ${STRUCTURES.map((s, i) => `
        <button class="unit-card" type="button" data-i="${i}" ${i < 2 ? '' : 'data-premium-only'}>
          <span class="unit-card-num">${s.category}</span>
          <span class="unit-card-title">${s.title}</span>
          <span class="unit-card-count">${s.uz_title}</span>
        </button>
      `).join('')}
    </div>
  `;
  gridView.querySelectorAll('[data-i]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const i = +btn.dataset.i;
      if (i >= 2 && typeof isPremium === 'function') {
        const premium = await isPremium();
        if (!premium) {
          if (typeof showPremiumModal === 'function') showPremiumModal();
          return;
        }
      }
      openStructure(i);
    });
  });
  if (typeof applyPremiumLocks === 'function') applyPremiumLocks();
}

function openStructure(i) {
  const s = STRUCTURES[i];
  detailView.innerHTML = `
    <div class="dash-greeting">
      <div>
        <span class="gs-cat-pill">${s.category}</span>
        <h1 style="margin-top:6px;">${s.title}</h1>
        <p style="font-style:italic;">${s.uz_title}</p>
      </div>
    </div>
    <div class="gs-structure-box">${s.structure}</div>
    <div class="gs-two-col">
      <div class="gs-col">
        <h4>Explanation</h4>
        <p style="margin:0; line-height:1.6;">${s.explanation}</p>
      </div>
      <div class="gs-col">
        <h4>O'zbekcha izoh</h4>
        <p style="margin:0; line-height:1.6;">${s.uz_explanation}</p>
      </div>
    </div>
    <div class="gs-example-box">
      <p class="en">"${s.example_en}"</p>
      <p class="uz">"${s.example_uz}"</p>
    </div>
    <div style="margin-top:18px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <button class="btn btn-outline" id="gsPrevBtn">&larr; Previous</button>
      <button class="link-muted back-link" id="gsBackToGridBtn" style="margin:0;">&larr; All structures</button>
      <button class="btn btn-outline" id="gsNextBtn">Next &rarr;</button>
    </div>
  `;
  gridView.hidden = true;
  detailView.hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });

  document.getElementById('gsBackToGridBtn').addEventListener('click', showGrid);
  document.getElementById('gsPrevBtn').addEventListener('click', () => openStructure((i - 1 + STRUCTURES.length) % STRUCTURES.length));
  document.getElementById('gsNextBtn').addEventListener('click', () => openStructure((i + 1) % STRUCTURES.length));
}

function showGrid() {
  detailView.hidden = true;
  gridView.hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderGrid();
</script>
</body>
</html>
